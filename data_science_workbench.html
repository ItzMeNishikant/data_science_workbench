<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LHEP Digital Twin - Final Year Project</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .water-flow {
            animation: flow 2s linear infinite;
        }
        body {
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 100% React-compliant Inline SVG Icon Component (Zero external dependencies)
        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                activity: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                    </svg>
                ),
                settings: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                ),
                "alert-triangle": (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                        <line x1="12" y1="9" x2="12" y2="13" />
                        <line x1="12" y1="17" x2="12.01" y2="17" />
                    </svg>
                ),
                zap: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                    </svg>
                ),
                cpu: (
                    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2" />
                        <rect x="9" y="9" width="6" height="6" />
                        <line x1="9" y1="1" x2="9" y2="4" />
                        <line x1="15" y1="1" x2="15" y2="4" />
                        <line x1="9" y1="20" x2="9" y2="23" />
                        <line x1="15" y1="20" x2="15" y2="23" />
                        <line x1="20" y1="9" x2="23" y2="9" />
                        <line x1="20" y1="15" x2="23" y2="15" />
                        <line x1="1" y1="9" x2="4" y2="9" />
                        <line x1="1" y1="15" x2="4" y2="15" />
                    </svg>
                )
            };
            return icons[name] || null;
        };

        const LHEPDigitalTwin = () => {
            const [scenario, setScenario] = useState('NORMAL');
            const [time, setTime] = useState(0);
            const [metrics, setMetrics] = useState({
                waterLevel: 85,
                flowRate: 320,
                turbineRPM: 187.5,
                genTemp: 65,
                vibration: 0.02,
                powerOutput: 0
            });

            const calculatePower = (head, flow) => {
                const efficiency = 0.91;
                const gravity = 9.81;
                const powerWatts = efficiency * 1000 * gravity * head * flow;
                return (powerWatts / 1000000).toFixed(2);
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    setTime(t => t + 1);
                    setMetrics(prev => {
                        let baseLevel = 85;
                        let baseFlow = 320;
                        let baseTemp = 65;
                        let baseVib = 0.02;

                        if (scenario === 'LOW_WATER') {
                            baseLevel = 45;
                            baseFlow = 120;
                        } else if (scenario === 'OVERHEAT') {
                            baseTemp = 95 + Math.random() * 5;
                            baseVib = 0.15 + Math.random() * 0.05;
                        }

                        const fluctuation = Math.sin(time * 0.5) * 0.5;
                        const currentLevel = baseLevel + fluctuation;
                        const currentFlow = baseFlow + (fluctuation * 2);
                        const power = calculatePower(currentLevel, currentFlow);

                        return {
                            waterLevel: currentLevel,
                            flowRate: currentFlow,
                            turbineRPM: scenario === 'LOW_WATER' ? 120 : 187.5 + fluctuation,
                            genTemp: baseTemp + fluctuation,
                            vibration: baseVib + (Math.random() * 0.01),
                            powerOutput: parseFloat(power)
                        };
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, [time, scenario]);

            const analytics = useMemo(() => {
                const healthIndex = scenario === 'OVERHEAT' ? 42 : scenario === 'LOW_WATER' ? 88 : 98;
                const rulDays = scenario === 'OVERHEAT' ? 12 : 450;
                const anomalyDetected = scenario === 'OVERHEAT';
                return { healthIndex, rulDays, anomalyDetected };
            }, [scenario]);



            return (
                <div className="min-h-screen p-6">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
                        <div>
                            <h1 className="text-3xl font-bold tracking-tight text-blue-400 uppercase">LHEP Stage-I Digital Twin</h1>
                            <p className="text-slate-400 text-sm">Final Year Project • SJVN Operational Monitoring System</p>
                        </div>
                        <div className="flex gap-4">
                            <div className={`px-4 py-2 rounded-full text-xs font-bold border ${analytics.anomalyDetected ? 'bg-red-900/30 border-red-500 text-red-400 animate-pulse' : 'bg-green-900/30 border-green-500 text-green-400'}`}>
                                STATUS: {analytics.anomalyDetected ? 'CRITICAL ALERT' : 'OPTIMAL'}
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-12 gap-6">
                        {/* Visualization */}
                        <div className="col-span-12 lg:col-span-8 bg-slate-900/50 rounded-2xl border border-slate-800 p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-lg font-semibold flex items-center gap-2">
                                    <Icon name="activity" className="text-blue-400" /> Plant Dynamics
                                </h2>
                                <div className="flex gap-2">
                                    {['NORMAL', 'LOW_WATER', 'OVERHEAT'].map(s => (
                                        <button 
                                            key={s}
                                            onClick={() => setScenario(s)}
                                            className={`px-3 py-1 rounded text-[10px] font-bold transition-all ${scenario === s ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}
                                        >
                                            {s.replace('_', ' ')}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="h-[400px] w-full relative border border-slate-800 rounded-xl bg-slate-950/50 flex items-center justify-around p-8 overflow-hidden">
                                {/* Dam & Reservoir */}
                                <div className="w-40 h-full bg-slate-800/30 rounded border-2 border-slate-700 relative overflow-hidden flex flex-col justify-end">
                                    <div 
                                        className="bg-blue-600/40 w-full transition-all duration-1000 relative"
                                        style={{ height: `${metrics.waterLevel}%` }}
                                    >
                                        <div className="absolute top-0 w-full h-1 bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.8)]" />
                                    </div>
                                    <div className="absolute top-4 left-4 text-[10px] font-mono text-blue-300">HEAD: {metrics.waterLevel.toFixed(1)}m</div>
                                </div>

                                {/* Penstock Flow */}
                                <div className="flex flex-col items-center">
                                   <div className="w-32 h-8 bg-slate-800/50 rounded-full relative overflow-hidden border border-slate-700">
                                       <div className="water-flow absolute inset-0 bg-blue-500/20" style={{ width: '200%' }} />
                                   </div>
                                   <div className="text-[10px] font-mono text-slate-500 mt-2 uppercase tracking-tighter">Penstock Flow</div>
                                </div>

                                {/* Turbine Unit */}
                                <div className="flex flex-col items-center gap-4">
                                    <div className="relative">
                                        <div 
                                            className={`w-32 h-32 rounded-full border-4 flex items-center justify-center transition-all ${analytics.anomalyDetected ? 'border-red-500 animate-pulse' : 'border-blue-500/50'}`}
                                            style={{ transform: `rotate(${time * metrics.turbineRPM * 0.1}deg)` }}
                                        >
                                            <Icon name="settings" size={64} className="text-slate-400" />
                                        </div>
                                        {analytics.anomalyDetected && <Icon name="alert-triangle" className="absolute -top-2 -right-2 text-red-500 animate-bounce" size={24} />}
                                    </div>
                                    <div className="text-center">
                                        <div className="text-xs font-bold uppercase">Francis Unit #1</div>
                                        <div className="text-[10px] text-slate-500 font-mono">{metrics.turbineRPM.toFixed(1)} RPM</div>
                                    </div>
                                </div>

                                {/* Grid Power */}
                                <div className="flex flex-col items-center">
                                    <Icon name="zap" size={32} className={metrics.powerOutput > 100 ? 'text-yellow-400 animate-pulse' : 'text-slate-600'} />
                                    <div className="text-[10px] font-mono text-slate-500 mt-2 uppercase">Grid Sync</div>
                                </div>
                            </div>
                        </div>

                        {/* Sidebar: Analytics */}
                        <div className="col-span-12 lg:col-span-4 space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                    <div className="text-slate-500 text-[10px] uppercase mb-1 flex items-center gap-1">Discharge (Q)</div>
                                    <div className="text-xl font-bold">{metrics.flowRate.toFixed(1)} <span className="text-[10px] text-slate-500">m³/s</span></div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                    <div className="text-slate-500 text-[10px] uppercase mb-1 flex items-center gap-1 text-yellow-500">Power Out (P)</div>
                                    <div className="text-xl font-bold text-yellow-400">{metrics.powerOutput} <span className="text-[10px] text-slate-500">MW</span></div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                    <div className="text-slate-500 text-[10px] uppercase mb-1 flex items-center gap-1">Stator Temp</div>
                                    <div className={`text-xl font-bold ${metrics.genTemp > 85 ? 'text-red-400' : ''}`}>{metrics.genTemp.toFixed(1)} <span className="text-[10px] text-slate-500">°C</span></div>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                    <div className="text-slate-500 text-[10px] uppercase mb-1 flex items-center gap-1">Vibration</div>
                                    <div className={`text-xl font-bold ${metrics.vibration > 0.1 ? 'text-orange-400' : ''}`}>{metrics.vibration.toFixed(3)} <span className="text-[10px] text-slate-500">mm/s</span></div>
                                </div>
                            </div>

                            <div className="bg-blue-600/10 border border-blue-500/30 p-5 rounded-2xl">
                                <h3 className="text-xs font-bold text-blue-400 mb-4 flex items-center gap-2 uppercase">
                                    <Icon name="cpu" size={14} /> AI Diagnostics Layer
                                </h3>
                                <div className="space-y-4">
                                    <div>
                                        <div className="flex justify-between text-[10px] mb-1 uppercase text-slate-400">
                                            <span>Health Index</span>
                                            <span className="font-bold text-blue-400">{analytics.healthIndex}%</span>
                                        </div>
                                        <div className="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                                            <div className={`h-full transition-all duration-1000 ${analytics.healthIndex < 50 ? 'bg-red-500' : 'bg-blue-500'}`} style={{ width: `${analytics.healthIndex}%` }} />
                                        </div>
                                    </div>
                                    <div className="flex justify-between items-center bg-slate-950 p-3 rounded border border-slate-800">
                                        <span className="text-[10px] text-slate-500 uppercase">RUL Estimation</span>
                                        <span className="text-sm font-bold">{analytics.rulDays} Days</span>
                                    </div>
                                    {analytics.anomalyDetected && (
                                        <div className="bg-red-950/50 border border-red-500/50 p-3 rounded text-[10px] text-red-200">
                                            <strong>ALERT:</strong> Thermal stress detected in Unit #1. Recommend emergency cooling protocol.
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-slate-900/50 border border-slate-800 p-4 rounded text-[9px] font-mono text-slate-500 uppercase leading-relaxed">
                                System: SJVN-LHEP-DT-STG1<br/>
                                Latency: 12ms (Sync)<br/>
                                Algorithm: Physics-Informed ML<br/>
                                Last Calibration: 06-JAN-2026
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LHEPDigitalTwin />);
    </script>
</body>
</html>
